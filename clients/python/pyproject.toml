[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livekit-plugins-cadence"
version = "0.2.0"
description = "Drop-in zero-downtime TTS failover proxy plugin for LiveKit Agents and Pipecat"
readme = "../../README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
livekit = [
    "livekit-agents>=1.0.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["python*"]
