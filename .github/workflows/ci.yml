name: Cadence CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Hermetic Chaos & DSP Splicer Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install libopus & system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopus-dev

      - name: Check code formatting
        run: cargo fmt --check

      - name: Clippy code analysis
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Hermetic Chaos Suite (Standard Release)
        run: cargo test --release --test chaos_failover -- --nocapture

      - name: Run Hermetic Chaos Suite with Opus FFI Enabled
        run: cargo test --release --features opus-encoding --test chaos_failover -- --nocapture

      - name: Upload WAV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wav-comparison-artifacts
          path: tests/artifacts/*.wav
          if-no-files-found: error
