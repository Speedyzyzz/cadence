services:
  cadence:
    build: .
    container_name: cadence-proxy
    ports:
      - "8080:8080"
      - "9091:9091"
    environment:
      - RUST_LOG=info
      - CADENCE_INGRESS_ADDR=0.0.0.0:8080
      - CADENCE_METRICS_ADDR=0.0.0.0:9091
      - CARTESIA_API_KEY=${CARTESIA_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cadence-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - cadence
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cadence-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=cadence
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/grafana-dashboard.json:/var/lib/grafana/dashboards/grafana-dashboard.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped
