# /etc/sysctl.d/99-cadence-realtime.conf
# High-throughput Linux kernel UDP/WebRTC & low-latency TCP WebSocket tuning for Cadence

# 64 MB maximum socket receive/send buffers for 10,000+ WebRTC UDP streams
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 16777216
net.core.wmem_default = 16777216
net.core.optmem_max = 4194304

# NIC ingress backlog and NAPI polling budget
net.core.netdev_max_backlog = 250000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000

# 50us busy polling to eliminate kernel epoll wake-up jitter
net.core.busy_poll = 50
net.core.busy_read = 50

# Upstream TTS WebSocket TCP stack optimization (BBR + TCP Fast Open)
net.ipv4.tcp_rmem = 4096 131072 67108864
net.ipv4.tcp_wmem = 4096 131072 67108864
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_tw_reuse = 1

# Ephemeral port range and system-wide file descriptor ceiling
net.ipv4.ip_local_port_range = 10240 65535
fs.file-max = 2097152
